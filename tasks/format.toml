#:schema https://mise.jdx.dev/schema/mise-task.json

["fmt:biome"]
description = "Format the frontend code with biome"
dir = "{{ vars.REPO_ROOT }}/frontend"
usage = """
flag "--check" env="LOGANDAIM_FMT_CHECK" help="Only performs a check of the formatting"
"""
run = 'npm run {% if usage.check %}check:format{% else %}fix:format{% endif %}'

["fmt:rust"]
description = "Format the rust code"
usage = """
flag "--check" env="LOGANDAIM_FMT_CHECK" help="Only performs a check of the formatting"
"""
run = 'cargo fmt --all{% if usage.check %} --check{% endif %}'

["fmt:typst"]
description = "Format the typst code"
usage = """
flag "--check" env="LOGANDAIM_FMT_CHECK" help="Only performs a check of the formatting"
"""
tools = { typstyle = "latest" }
run = 'typstyle . --wrap-text {% if usage.check %}--diff{% else %}-i{% endif %}'

["fmt:newline"]
description = "Ensures every non-binary file ends with a newline"
usage = """
flag "--check" env="LOGANDAIM_FMT_CHECK" help="Only performs a check of the formatting"
"""
tools."cargo:lineguard" = { version = "0.2.1" }
run = "lineguard .{% if usage.check %} {% else %} --fix {% endif %}-r --ignore '**/graphify-out/**'"
