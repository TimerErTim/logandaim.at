["test:unit"]
description = "Run the isolated tests (nextest profile `unit`, no external service)"
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build with the release profile"
"""
run = "cargo nextest run --workspace --profile unit{% if usage.release %} --release{% endif %}"

["test:e2e"]
description = "Run the end-to-end tests (nextest profile `e2e`) against a real Mailpit"
daemons = ["mailpit"]
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build with the release profile"
"""
run = "cargo nextest run --workspace --profile e2e{% if usage.release %} --release{% endif %}"

["test"]
description = "Run every test: unit first, then e2e with its services"
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build with the release profile"
"""
depends = ["LOGANDAIM_BUILD_RELEASE={{ usage.release }} test:?*"]
