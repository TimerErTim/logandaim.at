#:schema https://mise.jdx.dev/schema/mise-task.json
["export:openapi"]
description = "Export OpenAPI spec to stdout"
raw = true
# Same profile as the server: the spec is a product of the code that ships.
run = "cargo run -p logandaim-api --bin export_spec --features openapi --release"

["sync:openapi"]
description = "Sync OpenAPI spec from backend to frontend"
dir = "{{ vars.REPO_ROOT }}/frontend"
run = 'mise run --no-deps export:openapi | npx openapi-typescript -o src/api/schema.ts --enum-values --empty-objects-unknown --enum --dedupe-enums'
