#:schema https://mise.jdx.dev/schema/mise-task.json
["export:openapi"]
description = "Export OpenAPI spec to stdout"
raw = true
run = "cargo run -p logandaim-api --bin export_spec --features openapi"

["sync:openapi"]
description = "Sync OpenAPI spec from backend to frontend"
dir = "{{ vars.REPO_ROOT }}/frontend"
usage = """
flag "--release" env="LOGANDAIM_SYNC_OPENAPI_RELEASE" help="Build the OpenAPI spec in release mode"
"""
run = 'mise run --no-deps export:openapi{% if usage.release %} --release{% endif %} | npx openapi-typescript -o src/api/schema.ts --enum-values --empty-objects-unknown --enum --dedupe-enums'
