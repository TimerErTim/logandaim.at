#:schema https://mise.jdx.dev/schema/mise-task.json

["check:format"]
description = "Check the formatting of the code"
depends = ["LOGANDAIM_FMT_CHECK=true fmt:?*"]

["check:lint"]
description = "Check the linting of the code"
# Explicit list: the `lint:?*` glob does not cross the extra colon in
# `lint:check:ts`, which would silently drop `tsc --noEmit` from the gate.
depends = ["lint:crates", "lint:frontend", "lint:check:ts"]

["check:openapi"]
description = "Fail when the generated OpenAPI client differs from the exported spec"
# `depends` instead of a nested `mise run`: mise runs the shared dependency once per
# invocation, so the schema file is written once even when `build:frontend` and
# `lint:check:ts` need it in the same run.
depends = ["sync:openapi"]
run = "git diff --exit-code -- frontend/src/api/schema.ts"

["check:version"]
description = "Fail when the workspace, frontend, and changelog versions disagree"
run = """
#!/usr/bin/env bash
set -eu

cargo_version=$(sed -n '/^\\[workspace.package\\]/,/^\\[/p' Cargo.toml | sed -n 's/^version = "\\(.*\\)"/\\1/p' | head -n1)
frontend_version=$(jq -r '.version' frontend/package.json)
latest_changelog=$(sed -n 's/^## \\[\\([0-9][^]]*\\)\\].*/\\1/p' CHANGELOG.md | head -n1)

fail() {
  echo "check:version: $1" >&2
  exit 1
}

[ -n "$cargo_version" ] || fail "no version in [workspace.package] of Cargo.toml"
[ "$cargo_version" = "$frontend_version" ] || fail "Cargo.toml version '$cargo_version' != frontend/package.json version '$frontend_version'"
if [ -n "$latest_changelog" ]; then
  [ "$cargo_version" = "$latest_changelog" ] || fail "Cargo.toml version '$cargo_version' != newest CHANGELOG.md release '$latest_changelog'"
fi
grep -q '^## \\[Unreleased\\]' CHANGELOG.md || fail "CHANGELOG.md has no ## [Unreleased] section"

echo "check:version: $cargo_version ok"
"""

["check:release"]
description = "Verify that this branch is a valid release for the current version"
# Version agreement is part of being a valid release; declare it so the release
# check does not depend on `ci` having run first in the same job.
depends = ["check:version"]
tools.gh = "latest"
usage = """
flag "--pr <pr>" help="Release pull request number; derived from HEAD when omitted"
"""
run = """
#!/usr/bin/env bash
set -eu

version=$(sed -n '/^\\[workspace.package\\]/,/^\\[/p' Cargo.toml | sed -n 's/^version = "\\(.*\\)"/\\1/p' | head -n1)
pr="${usage_pr:-}"
repo="${LOGANDAIM_REPO:-${GITHUB_REPOSITORY:-TimerErTim/logandaim.at}}"
fail() {
  echo "check:release: $1" >&2
  exit 1
}

grep -q "^## \\[$version\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" CHANGELOG.md \\
  || fail "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"

# The section must say something: a dated heading with no entries would publish an
# empty release body as the changelog part.
section_entries=$(
  sed -n "/^## \\[$version\\]/,/^## \\[/p" CHANGELOG.md \\
    | grep -E '^[-*] ' \\
    | wc -l
)
[ "$section_entries" -gt 0 ] \\
  || fail "CHANGELOG.md has no entries under '## [$version]'"

# Compare against the most recent release tag rather than `main`, so the check
# behaves the same in a release pull request and in the push-to-main run that
# follows it. Tags are created by the `main` workflow only.
previous_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
if [ -n "$previous_tag" ]; then
  released_version=$(
    git show "$previous_tag:Cargo.toml" 2>/dev/null \\
      | sed -n '/^\\[workspace.package\\]/,/^\\[/p' \\
      | sed -n 's/^version = "\\(.*\\)"/\\1/p' \\
      | head -n1
  )
  if [ -n "$released_version" ] && [ "$released_version" = "$version" ]; then
    fail "version '$version' was already released as $previous_tag; bump it before opening the release pull request"
  fi
fi

# A release body that cannot be assembled would deploy the site and then fail to
# publish, so the whole body is generated here and discarded. gh needs network and
# authentication. A developer machine without them skips the remote parts so the
# gate stays usable offline; in CI the same failure fails the gate, before the
# deploy and before the tag.
ci=${GITHUB_ACTIONS:-${CI:-}}
if ! gh auth status >/dev/null 2>&1; then
  [ -z "$ci" ] || fail "gh is not authenticated; the release body cannot be assembled"
  echo "check:release: gh is not authenticated; skipped the release body check" >&2
else
  if gh release view "v$version" --repo "$repo" >/dev/null 2>&1; then
    fail "release v$version already exists on $repo; bump the version"
  fi

  if [ -n "$pr" ]; then
    case "$pr" in
      ''|*[!0-9]*) fail "--pr '$pr' is not a pull request number" ;;
    esac
  elif merged=$(gh api "repos/$repo/commits/$(git rev-parse HEAD)/pulls" \\
      --jq 'if type == "array" and length > 0 then (.[0].number | tostring) else "" end' 2>/dev/null); then
    pr="$merged"
    [ -n "$pr" ] || fail "no pull request is associated with HEAD; the release has no description"
  else
    [ -z "$ci" ] || fail "cannot reach $repo; the release body cannot be assembled"
    echo "check:release: cannot reach $repo; skipped the release body check" >&2
  fi

  if [ -n "$pr" ]; then
    mise run --no-deps release:notes "$version" --pr "$pr" -o /dev/null \\
      || fail "the release body cannot be generated from pull request #$pr"
  fi
fi

echo "check:release: $version ok"
"""

["check"]
description = "Check the code"
depends = ["check:format", "check:lint", "check:openapi", "check:version"]
