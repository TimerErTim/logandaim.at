#:schema https://mise.jdx.dev/schema/mise-task.json

# Smoke tests.
#
# Each service is split in three:
#   run:*     long-running process, a standalone script usable outside this gate
#             (for example to serve the export on a VPS)
#   smoke:*   assumes the service already runs, only health-checks it; standalone
#             as well, so it can verify a real deployment
#   verify:*  `daemons = [...]` starts the service and waits for readiness,
#             `depends = ["smoke:*"]` then runs the checks
#
# `depends` is required: a task started through `run = [{ task = "..." }]` does not
# start daemons. Daemons outlive the task, so stop them with
# `mise daemons stop frontend server`.

["run:frontend"]
description = "Build and serve the static frontend export"
depends = ["build:frontend"]
tools."npm:serve" = "latest"
run = "bash {{ vars.REPO_ROOT }}/tasks/scripts/serve-frontend.sh"

["serve:frontend"]
description = "Serve the built frontend export without building it first"
tools."npm:serve" = "latest"
run = "bash {{ vars.REPO_ROOT }}/tasks/scripts/serve-frontend.sh"

["smoke:frontend"]
description = "Health-check an already running frontend"
run = "node {{ vars.REPO_ROOT }}/tasks/scripts/smoke-frontend.mjs"

["verify:frontend"]
description = "Start the frontend daemon and smoke-test it"
daemons = ["frontend"]
depends = ["smoke:frontend"]

["run:server"]
description = "Build and run the backend server with a throwaway database"
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build and run the release profile"
"""
run = "node {{ vars.REPO_ROOT }}/tasks/scripts/run-server.mjs"

["smoke:server"]
description = "Health-check an already running backend"
run = "node {{ vars.REPO_ROOT }}/tasks/scripts/smoke-server.mjs"

["verify:server"]
description = "Start the backend daemon and smoke-test it"
daemons = ["server"]
depends = ["smoke:server"]

["verify"]
description = "Smoke-test the built frontend and backend"
depends = ["verify:frontend", "verify:server"]
