#:schema https://mise.jdx.dev/schema/mise-task.json

# PRs and local runs build the debug profile; CI release runs pass `--release`.
["build:server"]
description = "Build the standalone backend server binary"
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build with the release profile"
"""
run = """
#!/usr/bin/env bash
PROFILE_ARGS=$([ "${usage_release:-}" = "true" ] && echo "--release")
cargo build -p logandaim-server $PROFILE_ARGS
"""

["build:frontend"]
description = "Build the static Next.js frontend export"
dir = "{{ vars.REPO_ROOT }}/frontend"
depends = ["sync:openapi"]
# Task caching keeps `build` and the `run:frontend` daemon from both running the
# production build in the same gate.
sources = [
    "src/**",
    # Generated by `sync:openapi` (a declared dependency), and rewritten on every
    # run, so its timestamp must not invalidate the cache.
    "!src/api/schema.ts",
    "public/**",
    "next.config.ts",
    "postcss.config.mjs",
    "tsconfig.json",
    "biome.json",
    "package.json",
    "package-lock.json",
]
outputs = ["out/**"]
run = "npm run build"

["build"]
description = "Builds whole project"
depends = ["build:{server,frontend}"]
