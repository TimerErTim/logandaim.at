#:schema https://mise.jdx.dev/schema/mise-task.json

# The release profile is the build, not a CI variant of it. CI, the verify daemons,
# and the VPS all run the same binary this produces, so a defect that only appears
# with optimisations on cannot hide behind a gate that compiled something else.
# `mise run dev:server` still uses `cargo run` for a fast debug loop.

["build:server"]
description = "Build the standalone backend server binary (release profile)"
run = "cargo build -p logandaim-server --release"

["build:frontend"]
description = "Build the static Next.js frontend export"
dir = "{{ vars.REPO_ROOT }}/frontend"
depends = ["sync:openapi"]
# Caches the export, so the `build` task and the `run:frontend` daemon do not build
# twice in one gate. The cache keys on files, not the environment: `--force` when
# `NEXT_PUBLIC_*` changes.
sources = [
    "src/**",
    # Generated by `sync:openapi`, rewritten on every run: never invalidate on it.
    "!src/api/schema.ts",
    "public/**",
    "next.config.ts",
    "postcss.config.mjs",
    "tsconfig.json",
    "biome.json",
    "package.json",
    "package-lock.json",
]
outputs = ["out/**"]
run = "npm run build"

["build"]
description = "Builds whole project"
depends = ["build:{server,frontend}"]
