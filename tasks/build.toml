#:schema https://mise.jdx.dev/schema/mise-task.json

# PRs and local runs build the debug profile; CI release runs pass `--release`.
["build:server"]
description = "Build the standalone backend server binary"
usage = """
flag "--release" env="LOGANDAIM_BUILD_RELEASE" help="Build with the release profile"
"""
run = 'cargo build -p logandaim-server{% if usage.release %} --release{% endif %}'

["build:frontend"]
description = "Build the static Next.js frontend export"
dir = "{{ vars.REPO_ROOT }}/frontend"
depends = ["sync:openapi"]
# Caches the export, so the `build` task and the `run:frontend` daemon do not build
# twice in one gate. The cache keys on files, not the environment: `--force` when
# `NEXT_PUBLIC_*` changes.
sources = [
    "src/**",
    # Generated by `sync:openapi`, rewritten on every run: never invalidate on it.
    "!src/api/schema.ts",
    "public/**",
    "next.config.ts",
    "postcss.config.mjs",
    "tsconfig.json",
    "biome.json",
    "package.json",
    "package-lock.json",
]
outputs = ["out/**"]
# Dev-only routes (`.dev.tsx`) are gated by `pageExtensions` in `next.config.ts`.
# The assertion below proves the gate held: a file named `page.tsx` under
# `src/app/dev` would ship the gallery, so the build fails instead.
run = """
#!/usr/bin/env bash
set -eu
npm run build

if [ -d out/dev ]; then
  echo "build:frontend: out/dev exists; the pageExtensions dev gate is broken" >&2
  exit 1
fi

# One string the gallery renders and nothing else does; it would land in the
# prerendered RSC payload of `/dev` if the route slipped past the gate.
if grep -rqF -- "Design-Galerie" out; then
  echo "build:frontend: gallery code leaked into the static export" >&2
  exit 1
fi
"""

["build"]
description = "Builds whole project"
depends = ["build:{server,frontend}"]
