#:schema https://mise.jdx.dev/schema/mise-task.json

["dev:server"]
description = "Start backend dev server"
env.LOGANDAIM_BIND_ADDRESS = "127.0.0.1"
env.LOGANDAIM_BIND_PORT = 3000
env.LOGANDAIM_LOG_DIR = "{{ vars.REPO_ROOT }}/data.local/logs/"
env.LOGANDAIM_DATABASE_URL = "{{ vars.REPO_ROOT }}/data.local/logandaim.db"
env.LOGANDAIM_OBJECT_STORE_DIR = "{{ vars.REPO_ROOT }}/data.local/storage/"
env.LOGANDAIM_SMTP_HOST = "127.0.0.1"
daemons = ["mailpit"]
run = "cargo run -p logandaim-server --"

["dev:frontend"]
description = "Start Next.js dev server"
dir = "{{ vars.REPO_ROOT }}/frontend"
usage = """
flag "--port <port>" help="Port to use for the dev server" default="3001"
flag "--api <url>" env="NEXT_PUBLIC_LOGANDAIM_API_URL" help="API base URL the browser calls, including any path prefix such as /api" default="http://localhost:3000/api"
"""
# The API URL is baked into the client at build time and the browser has no sensible
# fallback, so the dev server supplies the local default; `--api` points a dev
# frontend at another backend. Exported inline because `env =` on a usage flag only
# reads the variable, it does not export it.
run = "NEXT_PUBLIC_LOGANDAIM_API_URL='{{ usage.api }}' npm run dev -- --port {{ usage.port }}"
