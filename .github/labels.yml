# Source of truth for repository labels. Synced by .github/workflows/labels.yml.

# Type
- name: "type: feature"
  color: "1d76db"
  description: "New user-visible capability"
- name: "type: bug"
  color: "d73a4a"
  description: "Behavior differs from spec"
- name: "type: spike"
  color: "c5def5"
  description: "Discovery or research with a written outcome"
- name: "type: chore"
  color: "ededed"
  description: "Maintenance, tooling, refactoring without behavior change"

# Priority
- name: "P0"
  color: "b60205"
  description: "Stop-ship: drop everything"
- name: "P1"
  color: "d93f0b"
  description: "Required for current milestone"
- name: "P2"
  color: "fbca04"
  description: "Important, not blocking milestone"
- name: "P3"
  color: "c2e0c6"
  description: "Later / nice to have"

# Workflow markers
- name: "needs-PO"
  color: "5319e7"
  description: "Blocked on a Product Owner decision"
- name: "ready"
  color: "0e8a16"
  description: "Meets the Ready gate; an agent or human may start"
- name: "agent-ok"
  color: "006b75"
  description: "Suitable for autonomous agent implementation"
- name: "blocked"
  color: "000000"
  description: "Waiting on another issue or external input"

# Area
- name: "area: backend"
  color: "bfdadc"
  description: "Rust core, API, persistence, server"
- name: "area: frontend"
  color: "bfd4f2"
  description: "Next.js static-export frontend"
- name: "area: infra"
  color: "d4c5f9"
  description: "CI, tooling, deployment"
- name: "area: specs"
  color: "fef2c0"
  description: "Product specs and ADRs"
- name: "area: branding"
  color: "f9d0c4"
  description: "logandaim.at identity, YAMS removal"
