name: Test report

# Publishes the JUnit report the CI gate uploads as a pull request check.
#
# `pr/base` runs with `contents: read` on purpose: a gate that can write checks or
# comments is a gate a pull request can influence. Creating a check run needs
# `checks: write`, so it happens here instead, in a workflow triggered by
# `workflow_run`, which always runs the version of this file from the default
# branch with the base repository's permissions.
#
# That privilege is exactly why nothing from the artifact is executed: the XML is
# parsed and rendered, never sourced, and no script from the pull request runs here.
#
# The gate is still what blocks a merge. This workflow reports results; it does not
# decide them, and a failure here never turns a red gate green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  # Read the completed run's artifacts.
  actions: read
  # Create the check run that shows the results.
  checks: write
  # Only needed to find the pull request the run belongs to.
  pull-requests: read

jobs:
  report:
    name: test-report
    # A run with no artifact has nothing to report.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the test report
        id: download
        uses: actions/download-artifact@v4
        with:
          name: junit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/report
        # The gate failed before the tests ran, so there is no report to publish.
        continue-on-error: true

      - name: Check that a report exists
        id: check
        run: |
          set -eu
          if [ -s "$RUNNER_TEMP/report/junit.xml" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No test report: the gate stopped before running the tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the results
        if: steps.check.outputs.found == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: ${{ runner.temp }}/report/junit.xml
          # The pull request head, not the merge commit the gate tested, so the
          # results attach to the pull request the reviewer is reading.
          commit: ${{ github.event.workflow_run.head_sha }}
          check_name: Test results
          # Never fail here: the gate already reported the same failures, and a
          # second red check on the same run would be noise.
          fail_on_failure: false
          # nextest's JUnit carries no file or line attributes, so there is nothing
          # to annotate inline. The summary tables are the whole report.
          check_annotations: false
          include_skipped: true
