name: Main

# Push to `main` means a release pull request was merged: deploy the static
# frontend and the backend, then cut a source-only GitHub release tagged `vX.Y.Z`.
# The tag is created by this workflow, never pushed by a human, so a failing gate
# cannot leave a tag behind.
#
# Nothing here builds the application. `pr/base` already compiled the release
# profile for this revision and uploaded the server binary and the static export.
# The image job wraps that binary in the runtime image and pushes it, `deploy:vps`
# pulls it by commit tag, and Pages deploys the export as built, so what ships is
# what the gate tested.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-${{ github.ref }}
  # A half-deployed site and a missing tag are worse than a queued run.
  cancel-in-progress: false

jobs:
  ci:
    name: pr/base
    # A called workflow cannot outrank its caller, so `checks: write` repeats here
    # or the release gate's test report silently no-ops. `pages: read` repeats for
    # the base path the export is built with.
    permissions:
      contents: read
      checks: write
      pages: read
    uses: ./.github/workflows/ci.yml

  # The same check a release pull request must pass, repeated here so a push that
  # bypassed its pull request still fails before anything deploys and before the tag.
  release-check:
    name: release-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-check.yml

  pages:
    name: deploy/pages
    needs: [ci, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The export was built by `pr/base` with the same base path and API URL
      # configured by `configure-pages` there. Deploying it as built is what makes
      # the artifact under test the artifact that ships.
      - name: Download the static export
        uses: actions/download-artifact@v8
        with:
          name: pages-export
          path: frontend/out

      - name: Upload the export
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  image:
    name: deploy/image
    # Builds the runtime image around the binary `pr/base` tested and pushes it. A
    # deployment can therefore only ship a binary the gate ran, and the VPS never
    # compiles. `deploy/backend` consumes this job's image reference, not an artefact.
    needs: [ci, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # The only reference any consumer may use: one immutable tag per commit.
      # `:main` is pushed for humans browsing the registry and is never passed on.
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download the server binary
        uses: actions/download-artifact@v8
        with:
          name: server
          path: .deploy/incoming

      # An artefact archive preserves no executable bit, and the image copy reads the
      # mode from the file. Restore it rather than trusting the transport.
      - name: Make the binary executable
        run: chmod 0755 .deploy/incoming/logandaim-server

      # GHCR rejects an uppercase owner, and the repository is `TimerErTim/...`.
      - name: Compose the image references
        id: reference
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'reference=%s\n' "ghcr.io/$owner/logandaim-server:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'main_tag=%s\n' "ghcr.io/$owner/logandaim-server:main" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The context is the binary alone. `.dockerignore` whitelists it, so the image
      # cannot pick up a file the gate never saw. `:main` is a convenience tag for
      # the registry UI; the `sha-<commit>` tag is what everything pulls.
      - name: Build and push the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.reference.outputs.reference }}
            ${{ steps.reference.outputs.main_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The digest is not an input to anything: it is printed so an operator can
      # compare a rollout against the pullable image without inspecting the package.
      # A summary that cannot read it must not fail a push that already succeeded.
      - name: Summarise the push
        env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
          MAIN_TAG: ${{ steps.reference.outputs.main_tag }}
        run: |
          set -eu
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$REFERENCE" 2>/dev/null | jq -r '.digest' 2>/dev/null || true)"
          {
            echo "### deploy/image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Deployed reference | \`$REFERENCE\` |"
            echo "| Digest | \`${digest:-unavailable}\` |"
            echo "| Human tag | \`$MAIN_TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: deploy/backend
    # Parallel with `deploy/pages`: the two deployments share no state, and neither
    # may hold the other back. `deploy/release` waits for both, so a failed
    # deployment still blocks the tag.
    needs: [ci, release-check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Only mise itself is needed: the deployment is a task and the tools it runs
      # are on the runner already. `install: false` skips downloading the project's
      # language toolchain, which this job never uses.
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: Prepare SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Set production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "::error::Set production secret VPS_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # The same task an operator runs for a manual deploy or a rollback. It
      # validates the reference and revision, then streams the remote half over SSH,
      # which pulls the image, applies compose, health-checks, and rolls back on
      # failure.
      - name: Deploy the image on the VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          set -eu
          test -n "${VPS_HOST:-}" || { echo "::error::Set production variable VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "::error::Set production variable VPS_USER"; exit 1; }
          test -n "${API_DOMAIN:-}" || { echo "::error::Set production variable API_DOMAIN"; exit 1; }
          mise run deploy:vps \
            "${{ needs.image.outputs.reference }}" \
            "${{ github.sha }}" \
            --host "$VPS_HOST" \
            --user "$VPS_USER" \
            --api-domain "$API_DOMAIN"

  release:
    name: deploy/release
    # Both deployments must succeed: the release announces what is running.
    needs: [ci, release-check, pages, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      # `release:publish` owns the tag and the body: the release check already
      # verified that both can be produced.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Create the release
        run: mise run release:publish
