name: Main

# Push to `main` means a release pull request was merged: deploy the static
# frontend and the backend, then cut a source-only GitHub release tagged `vX.Y.Z`.
# The tag is created by this workflow, never pushed by a human, so a failing gate
# cannot leave a tag behind.
#
# Nothing here builds the application. `pr/base` already compiled the release
# profile for this revision and uploaded the server binary and the static export;
# both deployments consume those artefacts, so what ships is what the gate tested.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-${{ github.ref }}
  # A half-deployed site and a missing tag are worse than a queued run.
  cancel-in-progress: false

jobs:
  ci:
    name: pr/base
    # A called workflow cannot outrank its caller, so `checks: write` repeats here
    # or the release gate's test report silently no-ops. `pages: read` repeats for
    # the base path the export is built with.
    permissions:
      contents: read
      checks: write
      pages: read
    uses: ./.github/workflows/ci.yml

  # The same check a release pull request must pass, repeated here so a push that
  # bypassed its pull request still fails before anything deploys and before the tag.
  release-check:
    name: release-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-check.yml

  pages:
    name: deploy/pages
    needs: [ci, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The export was built by `pr/base` with the same base path and API URL
      # configured by `configure-pages` there. Deploying it as built is what makes
      # the artifact under test the artifact that ships.
      - name: Download the static export
        uses: actions/download-artifact@v8
        with:
          name: pages-export
          path: frontend/out

      - name: Upload the export
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-backend:
    name: deploy/backend
    # Parallel with `deploy/pages`: the two deployments share no state, and neither
    # may hold the other back. `deploy/release` waits for both, so a failed
    # deployment still blocks the tag.
    needs: [ci, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Download the server binary
        uses: actions/download-artifact@v8
        with:
          name: server
          path: .deploy/incoming

      # The workflow never builds the image. The VPS assembles the runtime image
      # around this binary, so a deployment cannot ship a binary the gate did not run.
      - name: Prepare SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Set production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "::error::Set production secret VPS_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # `scp` preserves no mode promises: the script makes the binary executable
      # again before Docker copies it, and the runtime image sets its own mode.
      - name: Copy the server binary to the VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "::error::Set production variable VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::Set production variable VPS_USER"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::VPS_HOST must be a DNS name or IPv4 address"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::VPS_USER must be a valid Unix account name"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            'mkdir -p ~/logandaim.at/.deploy/incoming'
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            .deploy/incoming/logandaim-server \
            "$VPS_USER@$VPS_HOST:~/logandaim.at/.deploy/incoming/logandaim-server"

      - name: Deploy requested revision on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -eu
          test -n "$API_DOMAIN" || { echo "::error::Set production variable API_DOMAIN"; exit 1; }
          [[ "$API_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::API_DOMAIN must be a DNS hostname"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd ~/logandaim.at && bash deploy/deploy-vps.sh '$DEPLOY_REVISION' '$API_DOMAIN' .deploy/incoming/logandaim-server"

  release:
    name: deploy/release
    # Both deployments must succeed: the release announces what is running.
    needs: [ci, release-check, pages, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      # `release:publish` owns the tag and the body: the release check already
      # verified that both can be produced.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Create the release
        run: mise run release:publish
