name: Main

# Push to `main` means a release pull request was merged: deploy the static
# frontend, deploy the backend to the VPS, then cut a source-only GitHub release.
# The tag is created by this workflow, never pushed by a human, so a failing
# gate cannot leave a tag behind.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: pr/base
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml

  release-check:
    name: release-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-check.yml

  pages:
    name: deploy/pages
    needs: [ci, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache the npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache the Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ steps.pages.outputs.base_path }}-${{ vars.LOGANDAIM_API_URL }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ steps.pages.outputs.base_path }}-${{ vars.LOGANDAIM_API_URL }}-

      - name: Build the static export
        env:
          NEXT_PUBLIC_LOGANDAIM_API_URL: ${{ vars.LOGANDAIM_API_URL }}
          NEXT_PUBLIC_LOGANDAIM_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -eu
          if [ -z "${NEXT_PUBLIC_LOGANDAIM_API_URL:-}" ]; then
            echo "::error::Repository variable LOGANDAIM_API_URL is not set. The deployed frontend would call the API on its own origin."
            exit 1
          fi
          mise run --force build:frontend

      - name: Upload the export
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-backend:
    name: deploy/backend
    needs: [ci, release-check, pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Set production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "::error::Set production secret VPS_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy requested revision on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "::error::Set production variable VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::Set production variable VPS_USER"; exit 1; }
          test -n "$API_DOMAIN" || { echo "::error::Set production variable API_DOMAIN"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::VPS_HOST must be a DNS name or IPv4 address"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::VPS_USER must be a valid Unix account name"; exit 1; }
          [[ "$API_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::API_DOMAIN must be a DNS hostname"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd ~/logandaim.at && bash deploy/deploy-vps.sh '$DEPLOY_REVISION' '$API_DOMAIN'"

  release:
    name: deploy/release
    needs: [ci, release-check, pages, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Create the release
        run: mise run release:publish
