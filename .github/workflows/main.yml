name: Main

# Push to `main` means a release pull request was merged: deploy the static
# frontend, then cut a source-only GitHub release tagged `vX.Y.Z`.
#
# The tag is created by this workflow, never pushed by a human, so a failing
# gate cannot leave a tag behind.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  # A half-deployed site and a missing tag are worse than a queued run.
  cancel-in-progress: false

jobs:
  ci:
    name: pr/base
    uses: ./.github/workflows/ci.yml

  # The same check a release pull request must pass, repeated here so a push that
  # bypassed its pull request still fails before Pages deploys and before the tag.
  release-check:
    name: release-check
    uses: ./.github/workflows/release-check.yml

  pages:
    name: deploy/pages
    needs: [ci, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the static export
        env:
          NEXT_PUBLIC_LOGANDAIM_API_URL: ${{ vars.LOGANDAIM_API_URL }}
          # Empty once `logandaim.at` is the Pages custom domain, which serves at
          # the root. Until then the project site lives under `/logandaim.at/`.
          NEXT_PUBLIC_LOGANDAIM_BASE_PATH: ${{ vars.LOGANDAIM_BASE_PATH }}
        # `--force`: the task cache keys on files, not on environment, so a cached
        # export built for another base path or API URL must not be reused.
        run: mise run --force build:frontend

      - name: Upload the export
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: deploy/release
    # When `deploy/backend` is implemented, add it here so a failed deployment
    # blocks the tag.
    needs: [ci, release-check, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Read the version
        id: version
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          [ -n "$version" ] || { echo "::error::No version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Verify the version is unreleased
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Bump the version before merging into main."
            exit 1
          fi

      - name: Find the merged release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // ""')
          [ -n "$pr" ] || { echo "::error::No pull request found for $SHA"; exit 1; }
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Write the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PR: ${{ steps.pr.outputs.number }}
        run: mise run release:notes "$VERSION" --pr "$PR" -o release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  # Reserved for #15 and #24:
  #
  # deploy/backend:
  #   name: deploy/backend
  #   needs: [pages]
  #   ...
  #
  # `deploy/release` must then add it to its `needs`, so a failed backend
  # deployment blocks the tag. Deployment jobs run on push only, so they are not
  # required pull request checks and do not belong in the branch rulesets.
