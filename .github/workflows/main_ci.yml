name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: main-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/mise/
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-logandaim-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'frontend/package-lock.json') }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          reshim: true
          cache: true
          cache_key: mise-v1-{{platform}}-{{file_hash}}

      - name: Install dependencies
        run: mise deps

      - name: Check formatting and linting
        run: mise run -c check

      - name: Run tests
        run: mise run test

  smoke-build:
    name: Smoke build
    needs: verify
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/mise/
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-logandaim-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'frontend/package-lock.json') }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          reshim: true
          cache: true
          export_path: false
          cache_key: mise-v1-{{platform}}-{{file_hash}}

      - name: Install dependencies
        run: mise deps

      - name: Install npm dependencies on Windows
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npm install

      - name: Smoke build
        run: mise run build
