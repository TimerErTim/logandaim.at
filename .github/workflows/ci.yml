name: CI

# The shared gate. Every pull request and every push to `dev` runs it, and
# `main.yml` calls it as the release gate.
#
# Every step delegates to a mise task. Nothing here calls cargo, npm, biome, or
# typstyle directly, so CI cannot drift from a developer machine: the same
# `mise run ci` produces the same result.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a `main` run: it gates a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  base:
    name: pr/base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up tooling
        uses: ./.github/actions/setup

      - name: Run the full gate
        run: mise run ci

      # nextest writes this even when tests fail, which is exactly when it matters.
      # Publishing happens in `test-report.yml`: `workflow_run` gives that workflow
      # the permissions a check run needs, which this gate does not have. Nothing
      # here reads the artifact, so a malicious PR cannot shape the report.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/nextest/default/junit.xml
          # Tests may not have run at all if `check` failed earlier.
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop verify daemons
        if: always()
        run: mise daemons stop || true
