name: Feature delivery
description: A bounded slice of an approved spec
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one reviewable PR. The spec must be `PO-approved` before this issue is `ready`.
        See [.github/CONTRIBUTING.md](https://github.com/TimerErTim/logandaim.at/blob/main/.github/CONTRIBUTING.md).
  - type: input
    id: spec
    attributes:
      label: Spec section
      description: Link to the spec section this issue delivers.
      placeholder: specs/product/wertung.md#acceptance-criteria
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true for the user when this issue is closed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the spec ACs this issue covers, with their numbers.
      placeholder: |
        - [ ] AC-1: …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this issue explicitly does not do.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Blocked by #…"
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests at which layer, manual checks, commands.
      placeholder: |
        - Domain unit tests in crates/…
        - mise run check && mise run test
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0", "P1", "P2", "P3"]
    validations:
      required: true
