[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
jobs = 1

[vars]
REPO_ROOT = "{{config_root}}"
# TODO(manual investigation): `[daemons]` cannot read these, so the ports repeat
# there as literal integers.
FRONTEND_PORT = "4173"
API_PORT = "3311"

[tools]
node = "lts"
"cargo:cargo-nextest" = "latest"
# Supervises the verify:* daemons.
pitchfork = "2.32.1"
jq = "latest"

[deps.npm]
# Would love to have this auto, but it's not working on windows
#auto = true
dir = "frontend/"

[task_config]
includes = [
    "tasks/format.toml",
    "tasks/linting.toml",
    "tasks/check.toml",
    "tasks/fixes.toml",
    "tasks/tests.toml",
    "tasks/dev.toml",
    "tasks/run.toml",
    "tasks/misc.toml",
    "tasks/build.toml",
    "tasks/verify.toml",
    "tasks/release.toml",
    "tasks/ci.toml",
]

# Local services used by `mise run verify:*`.
#
# TODO(manual investigation): `ready_http` needs the literal port below because
# `{{ url }}` renders the pitchfork proxy URL, not the listener the task binds.
# Consequence: the ports repeat `[vars]` above.
[daemons.frontend]
task = "run:frontend"
port = 4173
ready_http = "http://127.0.0.1:4173/"

[daemons.server]
task = "run:server"
port = 3311
ready_http = "http://127.0.0.1:3311/api/health"
