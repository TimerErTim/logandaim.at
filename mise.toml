[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
jobs = 1

[vars]
REPO_ROOT = "{{config_root}}"
# `[daemons]` cannot read vars, so the ports below repeat these as literals.
FRONTEND_PORT = "4173"
API_PORT = "3311"

[tools]
node = "lts"
"cargo:cargo-nextest" = "latest"
pitchfork = "2.32.1"
jq = "latest"
mailpit = "latest"

[deps.npm]
dir = "frontend/"

[task_config]
includes = [
    "tasks/format.toml",
    "tasks/linting.toml",
    "tasks/check.toml",
    "tasks/fixes.toml",
    "tasks/tests.toml",
    "tasks/dev.toml",
    "tasks/run.toml",
    "tasks/misc.toml",
    "tasks/build.toml",
    "tasks/verify.toml",
    "tasks/release.toml",
    "tasks/ci.toml",
]

[daemons.frontend]
task = "run:frontend"
args = ["--host", "127.0.0.1", "--port", "4173"]
port = 4173
ready_http = "http://127.0.0.1:4173/"

# Local SMTP catcher: SMTP on 1025, the HTTP API the e2e suite reads on 8025.
[daemons.mailpit]
init = ["mkdir -p target/mailpit"]
run = """
exec mailpit \
  --smtp 127.0.0.1:1025 \
  --listen 127.0.0.1:$MAILPIT_PORT \
  --smtp-auth-accept-any \
  --smtp-auth-allow-insecure \
  --database target/mailpit/mailpit.db
"""
port = 8025
ready_http = "http://127.0.0.1:8025/api/v1/info"

[daemons.server]
task = "run:server"
args = [
    "--host",
    "127.0.0.1",
    "--port",
    "3311",
    "--database-url",
    ":memory:",
    "--object-store-dir",
    "target/smoke-server/storage",
]
port = 3311
ready_http = "http://127.0.0.1:3311/api/health"
