[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
jobs = 1

[vars]
REPO_ROOT = "{{config_root}}"
# Single source of truth for the smoke-test ports. Keep the [daemons] ports in sync.
FRONTEND_PORT = "4173"
API_PORT = "3311"

[tools]
node = "lts"
"cargo:cargo-nextest" = "latest"
# Supervises the verify:* daemons.
pitchfork = "2.32.1"
# Serves the static frontend export for smoke tests.
"npm:serve" = "latest"
# Needed by check:version and smoke:server.
jq = "latest"
# Needed by release:notes; CI authenticates it through GH_TOKEN.
gh = "latest"

[deps.npm]
# Would love to have this auto, but it's not working on windows
#auto = true
dir = "frontend/"

[task_config]
includes = [
    "tasks/format.toml",
    "tasks/linting.toml",
    "tasks/check.toml",
    "tasks/fixes.toml",
    "tasks/tests.toml",
    "tasks/dev.toml",
    "tasks/misc.toml",
    "tasks/build.toml",
    "tasks/verify.toml",
    "tasks/release.toml",
    "tasks/ci.toml",
]

# Local services used by `mise run verify:*`.
#
# `ready_http` must use a literal port: mise only renders templates inside `run`,
# a `{{ url }}` in `ready_cmd`/`ready_http` reaches pitchfork unrendered.
# Ports mirror [vars] above.
[daemons.frontend]
task = "run:frontend"
port = 4173
ready_http = "http://127.0.0.1:4173/"

[daemons.server]
task = "run:server"
port = 3311
ready_http = "http://127.0.0.1:3311/api/health"
