[package]
name = "yams-api"
description = "API for the logandaim.at project"
version.workspace = true
authors.workspace = true
license-file.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
yams-core = { path = "../yams-core" }

thiserror = { workspace = true }
error-stack = { workspace = true }

async-trait = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }

poem-openapi = { workspace = true, features = ["uuid", "chrono", "swagger-ui", "redoc"], optional = true }
poem = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
default = ["serde", "openapi"]
openapi = ["dep:poem-openapi", "dep:poem"]
serde = ["dep:serde", "uuid/serde", "chrono/serde", "error-stack/serde"]

[dev-dependencies]
pollster = { version = "0.4.0", features = ["macro"] }
poem = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
yams-fakes = { path = "../yams-fakes" }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "export_spec"
required-features = ["openapi"]
