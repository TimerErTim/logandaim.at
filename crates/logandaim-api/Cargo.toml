[package]
name = "logandaim-api"
description = "API for logandaim.at"
version.workspace = true
authors.workspace = true
license-file.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
logandaim-core = { path = "../logandaim-core" }

thiserror = { workspace = true }
error-stack = { workspace = true }

async-trait = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
rust_decimal = { workspace = true }

poem-openapi = { workspace = true, features = ["uuid", "chrono", "rust_decimal", "swagger-ui", "redoc"], optional = true }
poem = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
default = ["serde", "openapi"]
openapi = ["dep:poem-openapi", "dep:poem", "dep:futures"]
serde = [
    "dep:serde",
    "uuid/serde",
    "chrono/serde",
    "error-stack/serde",
    "rust_decimal/serde",
]

[dev-dependencies]
pollster = { version = "0.4.0", features = ["macro"] }
poem = { workspace = true, features = ["test"] }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
logandaim-sqlite = { path = "../logandaim-sqlite" }
logandaim-fakes = { path = "../logandaim-fakes" }
logandaim-filesystemstore = { path = "../logandaim-filesystemstore" }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "export_spec"
required-features = ["openapi"]
