name: logandaim

services:
  backend:
    # `deploy:vps` exports the exact reference it was asked to deploy, and the
    # required form fails to render if it is missing. A default would let a deploy
    # silently run whatever a moving tag pointed at. For a local build, add
    # `compose.build.yaml`:
    #   docker compose -f compose.yaml -f compose.build.yaml up --build
    image: ${LOGANDAIM_IMAGE:?Set LOGANDAIM_IMAGE to ghcr.io/<owner>/logandaim-server:sha-<commit>, or use compose.build.yaml}
    restart: unless-stopped
    env_file:
      - path: ./secrets/mail.env
        required: false
    environment:
      LOGANDAIM_BIND_ADDRESS: 0.0.0.0
      LOGANDAIM_BIND_PORT: "3000"
      LOGANDAIM_DATABASE_URL: /data/sqlite/logandaim.db
      LOGANDAIM_OBJECT_STORE_DIR: /data/objects
      LOGANDAIM_SIGNING_KEY_PATH: /run/secrets/signing-key.pem
      LOGANDAIM_TOKEN_ISSUER: ${API_DOMAIN:?Set API_DOMAIN in .env}
      LOGANDAIM_TOKEN_AUDIENCE: logandaim-api
      LOGANDAIM_FRONTEND_BASIS_URL: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      LOGANDAIM_CORS_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      LOGANDAIM_SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      # Composition, not operator configuration: a value here that disagrees with the
      # service below only fails at send time.
      LOGANDAIM_SMTP_HOST: stalwart
      LOGANDAIM_SMTP_PORT: "587"
      LOGANDAIM_SMTP_TLS_HOSTNAME: ${MAIL_HOSTNAME:?Set MAIL_HOSTNAME in .env}
      LOGANDAIM_SMTP_VERSCHLUESSELUNG: startTls
      LOGANDAIM_SMTP_ABSENDER: ${MAIL_ABSENDER:?Set MAIL_ABSENDER in .env}
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/objects:/data/objects
      - ./secrets/signing-key.pem:/run/secrets/signing-key.pem:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      # Order only: the API must not wait for mail to serve requests (NFR-5).
      stalwart:
        condition: service_started
    networks:
      - app

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  # Mandatory for the MVP. Only the setup UI is published, on loopback; SMTP stays
  # inside the Compose network.
  stalwart:
    image: stalwartlabs/stalwart:v1
    init: true
    restart: unless-stopped
    volumes:
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "587"
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  stalwart_etc:
  stalwart_data:
